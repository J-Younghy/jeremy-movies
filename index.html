      <label class="sort">

          <option value="rating">评分</option>
          <option value="year">年份</option>
        </select>

    </section>

    <!-- 海报网格（由 JS 数据驱动渲染） -->

  <!-- ===== 悬停 / 点按预览：全屏虚化剧照背景 + 海报保持原样 + 空白区剧情梗概（JS 驱动） ===== -->
  <div class="preview-bg" data-preview-bg aria-hidden="true">
    <img class="preview-bg__img" alt="" />
    <div class="preview-bg__scrim"></div>
  </div>
  <!-- 海报克隆：贴到原海报相同位置与尺寸，浮于虚化背景之上（视觉上"海报不变"） -->
  <div class="poster-card preview-card" data-preview-card aria-hidden="true"></div>
  <!-- 剧情梗概：自适应放在海报旁的空白一侧 -->
  <div class="preview-overview" data-preview-overview aria-hidden="true">
    <div class="preview-overview__head">
      <h3 class="preview-overview__title"></h3>
      <span class="preview-overview__year"></span>
    </div>
    <div class="preview-overview__stills" data-preview-stills></div>
    <ul class="preview-overview__meta"></ul>
    <p class="preview-overview__text"></p>
    <div class="preview-overview__ratings"></div>
    <blockquote class="preview-overview__comment"></blockquote>
    <div class="preview-overview__cast"></div>
  </div>

  <!-- ===== IMDB 式详情页 overlay（全屏，无页面跳转） ===== -->
  <div class="detail" data-detail role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <button class="detail__back" data-detail-back aria-label="返回电影墙">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </button>

    <div class="detail__hero">
      <img class="detail__backdrop" alt="" />
    </div>

    <div class="detail__body container">
      <header class="detail__head">
        <div class="detail__titles">
          <h2 class="detail__title" id="detail-title">片名</h2>
          <p class="detail__orig">原名 · 年份</p>
        </div>
        <div class="detail__head-side">
          <span class="detail__status"></span>
        </div>
        <ul class="detail__meta"></ul>
      </header>

      <div class="detail__grid">
        <div class="detail__main">
          <section class="detail__block detail__block--trailer" data-detail-trailer hidden>
            <h3 class="detail__h">预告片</h3>
            <div class="detail__trailer-box">
              <div class="detail__trailer-placeholder" data-trailer-placeholder>
                <button class="detail__trailer-btn" data-trailer-btn type="button" aria-label="播放预告片">
                  <svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"></polygon></svg>
                  <span>播放预告片</span>
                </button>
              </div>
              <div class="detail__trailer-player" data-trailer-player hidden></div>
            </div>
          </section>
          <section class="detail__block detail__block--overview">
            <h3 class="detail__h">剧情简介</h3>
            <p class="detail__overview"></p>
          </section>
          <section class="detail__block detail__block--directors">
            <h3 class="detail__h">导演</h3>
            <div class="detail__directors"></div>
          </section>
          <section class="detail__block detail__block--cast">
            <h3 class="detail__h">主演</h3>
            <ul class="detail__cast"></ul>
          </section>
        </div>

        <aside class="detail__side">
          <section class="detail__block detail__block--ratings">
            <h3 class="detail__h">评分</h3>
            <ul class="rating-list"></ul>
          </section>
          <section class="detail__block detail__personal">
            <h3 class="detail__h">Jeremy 说</h3>
            <div class="detail__stars"></div>
            <p class="detail__comment"></p>
          </section>
        </aside>
      </div>
    </div>
  </div>

  <!-- 预告片浮窗：iframe 常驻于此，永不移动（保证详情页→海报墙声音无缝连续） -->
  <div class="trailer-pop" data-trailer-pop aria-hidden="true" hidden>
    <div class="trailer-pop__head">
      <span class="trailer-pop__title"></span>
      <button class="trailer-pop__close" data-trailer-pop-close type="button" aria-label="关闭浮窗">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="trailer-pop__stage" data-trailer-pop-stage></div>
  </div>
  <!-- 手机端收起态控件：右下角胶囊，含「展开」+「关闭」两个按钮 -->
  <div class="trailer-dock" data-trailer-dock aria-hidden="true" hidden>
    <button class="trailer-dock__expand" data-trailer-dock-expand type="button" aria-label="展开预告片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="trailer-dock__close" data-trailer-dock-close type="button" aria-label="关闭预告片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <!-- 火后余温光晕 + 拟火元素 -->
  <div class="detail__glow" data-detail-glow aria-hidden="true"></div>
  <div class="fire" data-fire aria-hidden="true"></div>

  <!-- SVG 滤镜定义：拟火不规则锯齿边缘 -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="fire-edge" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.024" numOctaves="4" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="36" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
        <feGaussianBlur in="displaced" stdDeviation="1.6"/>
      </filter>
    </defs>
  </svg>

  <script src="assets/js/main.js?v=20261021b"></script>
