<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>这是什么 — Jeremy's</title>
  <meta name="description" content="这个板块还在装修中，敬请期待。">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://jeremy-movies.com/everything/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jeremy's">
  <meta property="og:title" content="这是什么">
  <meta property="og:url" content="https://jeremy-movies.com/everything/">
  <meta property="og:locale" content="zh_CN">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark' || t === 'system') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    /* —— 装修中页面 —— */
    .reno {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 20px;
    }
    .reno-scene {
      position: relative;
      width: min(320px, 78vw);
      height: 260px;
      margin-bottom: 24px;
    }
    .reno-title {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 0 0 10px;
      letter-spacing: 0.04em;
    }
    .reno-sub {
      font-size: 1rem;
      opacity: 0.62;
      margin: 0;
    }

    /* —— Celeste 风格像素跑步动画（程序生成的 Madeline 风 sprite） —— */
    /* 像素锐利：放大后仍是清晰方块 */
    .runner img {
      image-rendering: pixelated;
      width: 100%;
      height: 100%;
      display: block;
    }

    .runner {
      position: absolute;
      left: 50%;
      bottom: 56px;
      width: 120px;   /* 24px 原稿 × 5 */
      height: 130px;  /* 26px 原稿 × 5 */
      margin-left: -60px;
      /* 身体整体上下弹跳，配合 4 帧步频（steps 保持像素的顿挫感） */
      animation: runner-bob 0.36s steps(2, end) infinite;
    }
    @keyframes runner-bob {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    /* 逐帧切换：4 帧循环，steps(1) 硬切不补间 → 真正的像素帧动画 */
    .runner-frame {
      position: absolute;
      inset: 0;
      animation: frame-cycle 0.36s steps(1, end) infinite;
    }
    .runner-frame:nth-child(2) { animation-delay: -0.09s; }
    .runner-frame:nth-child(3) { animation-delay: -0.18s; }
    .runner-frame:nth-child(4) { animation-delay: -0.27s; }
    @keyframes frame-cycle {
      0%   { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }

    /* 地面：像素风格的方块跑道，向右滚动 */
    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 48px;
      height: 6px;
      overflow: hidden;
      opacity: 0.22;
    }
    .ground-dash {
      display: block;
      height: 100%;
      background: repeating-linear-gradient(
        90deg,
        currentColor 0,
        currentColor 16px,
        transparent 16px,
        transparent 32px
      );
      animation: ground-move 0.36s steps(4, end) infinite;
    }
    @keyframes ground-move {
      from { transform: translateX(0); }
      to   { transform: translateX(-32px); }
    }
  </style>
</head>
<body>
  <header class="nav" data-nav>
    <a class="nav-logo" href="/">Jeremy's</a>
    <nav class="nav-links" aria-label="主导航">
      <a href="/" class="nav-link">电影</a>
      <a href="/everything/" class="nav-link is-active" aria-current="page">这是什么</a>
      <a href="/about/" class="nav-link">关于</a>
    </nav>
    <button class="nav-theme" data-theme-toggle aria-label="切换主题" title="切换主题">🌙</button>
    <button class="nav-burger" data-nav-burger aria-label="菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main>
    <section class="reno">
      <div class="reno-scene" aria-hidden="true">
        <!-- Celeste 风格像素红发女孩跑步：4 帧逐帧循环（assets/madeline 程序生成 sprite） -->
        <div class="runner">
          <img class="runner-frame" src="../assets/madeline/run-0.png" alt="">
          <img class="runner-frame" src="../assets/madeline/run-1.png" alt="">
          <img class="runner-frame" src="../assets/madeline/run-2.png" alt="">
          <img class="runner-frame" src="../assets/madeline/run-3.png" alt="">
        </div>
        <!-- 地面 -->
        <div class="ground"><span class="ground-dash"></span></div>
      </div>

      <h1 class="reno-title">装修中</h1>
      <p class="reno-sub">这个板块正在加紧施工，敬请期待</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Jeremy</p>
  </footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
